[package]
name = "byteable_derive"
version = "0.20.0"
edition = "2024"
description = "Custom derive macros for the byteable crate."
license = "MIT"
repository = "https://github.com/PaulDepping/byteable"
readme = "README.md"

[features]
# Mirrors of the `byteable` crate's own `std`/`tokio`/`embedded-io`/`embedded-io-async` features,
# forwarded from `byteable/Cargo.toml` so the derive macro can tell, at expansion time, which of
# the four dynamic-pipeline wire formats (`std::io`, `tokio`, `embedded-io`, `embedded-io-async`)
# are actually available to generate against. Not tied to any real dependency here — pure
# compile-time switches.
std = []
tokio = []
embedded-io = []
embedded-io-async = []

[dependencies]
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = "2.0.117"

[lib]
proc-macro = true
